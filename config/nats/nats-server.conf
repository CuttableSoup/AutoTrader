# NATS JetStream for AutoTrader. Single binary, localhost only.
# Streams are created by scripts/bootstrap_streams.py from schemas/topics.json
# (max_age and max_msgs are set there, from day one).

listen: 127.0.0.1:4222
http: 127.0.0.1:8222
server_name: autotrader-bus

jetstream {
  store_dir: "var/jetstream"
  max_memory_store: 256MB
  max_file_store: 20GB
}

# Production: enable TLS and per-service accounts. Localhost-only for dev/paper.
# tls { cert_file: "..." key_file: "..." }
# accounts { ... }

max_payload: 4MB
write_deadline: "10s"
