[project]
name = "autotrader"
version = "0.1.0"
description = "AutoTrader Python sidecars: logger, event feed, universe builder, Claude validator, evaluation, fake Alpaca"
requires-python = ">=3.12"
dependencies = [
  "nats-py>=2.9",
  "anthropic>=0.60",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "websockets>=13",
  "aiohttp>=3.10",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
at-logger = "autotrader.logger_service:main"
at-events-feed = "autotrader.events_feed.feed:main"
at-universe = "autotrader.universe.builder:main"
at-validator = "autotrader.validator.sidecar:main"
at-evaluate-claude = "autotrader.evaluation.counterfactual:main"
at-fake-alpaca = "autotrader.fake_alpaca.server:main"
at-pager = "autotrader.pager:main"
at-research = "autotrader.research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
